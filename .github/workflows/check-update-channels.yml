name: Check JS and Rust channel freshness

on:
  workflow_dispatch:
    inputs:
      batch_minutes:
        description: 'Session duration; successor sessions always use 20 minutes'
        type: choice
        default: '20'
        options: ['1', '20']
  schedule:
    - cron: '3-58/5 * * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: devast-channel-freshness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Monitor channel freshness and dispatch verified builds
        env:
          GH_TOKEN: ${{ github.token }}
          WATCH_MINUTES: ${{ inputs.batch_minutes || '20' }}
        run: python3 -u tools/check_update_channels.py --dispatch --watch-minutes "$WATCH_MINUTES"
      # workflow_dispatch events are allowed to start another run when created
      # with GITHUB_TOKEN. This handoff does not depend on delivery of cron events.
      - name: Start the next monitoring session
        if: success() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check-update-channels.yml --ref main
