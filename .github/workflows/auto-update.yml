name: Check game JS and build update

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Avoid the busiest quarter-hour boundaries in GitHub's scheduler.
    - cron: '7,22,37,52 * * * *'

# Publish only the fully verified current mod to the updates branch.
permissions:
  contents: write

concurrency:
  group: devast-auto-update
  cancel-in-progress: false

jobs:
  update:
    # Keep Playwright's supported OS stable across GitHub runner-image rollouts.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Install Rust with the WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Rust toolchain dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen*
            rust-mod/target
          key: devast-rust-${{ runner.os }}-${{ hashFiles('rust-mod/Cargo.lock') }}
      - name: Install matching Wasm bindings tool
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -qx 'wasm-bindgen 0.2.105'; then
            cargo install wasm-bindgen-cli --version 0.2.105 --locked
          fi
      - name: Build canonical Rust for regression tests
        run: npm run build:rust
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: devast-playwright-${{ runner.os }}-ubuntu-24.04-${{ hashFiles('package-lock.json') }}
      - name: Select official Ubuntu package mirror
        run: |
          # The hosted runner's regional EC2 mirror can transfer packages too
          # slowly to finish installing Playwright dependencies. Keep APT's
          # signed package verification and use Ubuntu's official HTTPS archive.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
      - name: Install browser system dependencies
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            if npx playwright-core install-deps chromium firefox; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          exit 1
      - name: Install Chromium and Firefox
        timeout-minutes: 5
        run: |
          for attempt in 1 2 3; do
            if npx playwright-core install chromium firefox; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          exit 1
      - run: npm run build
      - name: Restore local updater history
        uses: actions/cache/restore@v4
        with:
          path: |
            .updater/http-cache
            dist/auto-update
            dist/rust-auto-update
          key: devast-updater-${{ github.run_id }}
          restore-keys: devast-updater-
      - run: npm run update:once
      - name: Publish the verified client
        run: python3 tools/publish_update.py
      - name: Build, verify and publish the Rust client on the current game JS
        run: python3 tools/update_rust.py --publish
      - name: Save verified versions for the next check
        uses: actions/cache/save@v4
        with:
          path: |
            .updater/http-cache
            dist/auto-update
            dist/rust-auto-update
          key: devast-updater-${{ github.run_id }}
      - name: Upload the local result for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devast-auto-update
          # Keep metadata and the latest failed candidate's diagnostics;
          # uploading every cached historical version had grown past 400 MB.
          path: |
            dist/auto-update/current.json
            dist/auto-update/status.json
            dist/rust-auto-update/current.json
            dist/rust-auto-update/versions/*/verification.json
            .updater/failed-latest/*.json
            .updater/failed-latest/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
