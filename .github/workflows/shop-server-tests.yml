name: Check server 67 shop

on:
  push:
    branches: [codex/server67-shop-hosting]
    paths: ['server-shop/**', '.github/workflows/shop-server-tests.yml']
  pull_request:
    paths: ['server-shop/**', '.github/workflows/shop-server-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shop:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: server-shop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the receiver and installer
        run: |
          python -m py_compile shop.py server.py manage.py build_catalog.py
          bash -n deploy/install-vps.sh
      - name: Test accounts, balances, purchases and HTTP callbacks
        run: python -m unittest discover -s tests -v
